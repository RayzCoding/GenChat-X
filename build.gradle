plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.genchat'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'

    // Spring AI
    implementation platform('org.springframework.ai:spring-ai-bom:2.0.0')
    implementation('org.springframework.ai:spring-ai-starter-model-openai')
    implementation 'org.springframework:spring-webflux'
    implementation 'org.springframework.ai:spring-ai-starter-mcp-client'
    implementation 'io.modelcontextprotocol.sdk:mcp-json-jackson2:2.0.0'
    implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'

    // Keep existing persistence/tool JSON on Jackson 2; Boot manages both Jackson generations.
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // Agent foundation
    implementation platform('com.agent.foundation:agent-foundation-bom:2.0.0-SNAPSHOT')
    implementation 'com.agent.foundation:agent-foundation-core'

    // redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.redisson:redisson-spring-boot-starter:4.7.0'

    // Minio
    implementation 'io.minio:minio:8.6.0'

    // Apache PDFBox
    implementation 'org.apache.pdfbox:pdfbox:3.0.4'

    // Apache POI (doc + docx)
    implementation 'org.apache.poi:poi:5.3.0'
    implementation 'org.apache.poi:poi-ooxml:5.3.0'
    implementation 'org.apache.poi:poi-scratchpad:5.3.0'

    // MySQL
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Flyway
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-mysql'

    // MyBatis-Plus
    implementation 'com.baomidou:mybatis-plus-spring-boot4-starter:3.5.17'

    // Spring AI RAG (query expansion for EmbeddingService)
    implementation 'org.springframework.ai:spring-ai-rag'

    // MapStruct
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Lombok-MapStruct binding (lombok must be before mapstruct-processor in annotation processing)
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-http-codec'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
